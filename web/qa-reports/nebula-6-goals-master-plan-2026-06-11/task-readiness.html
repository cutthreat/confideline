      code:"G6.5", title:"Командные уведомления", goal:"Цель 6", stage:"master_plan_only", progress:0, tzReady:20, detailHref:"tasks/task-g6-team-notifications.html",

        "Связать их с назначением ответственных, сроками реакции, качеством и поддержкой.",
        "Собрать минимальный полезный контур без спама."

      accept:[

  const taskTermEn = {
    "task-g1-session": "service session",
    "task-g1-chat": "role-based chat",
    "task-g1-statuses": "state machine / lifecycle",
    "task-g1-chat-notifications": "chat notifications",
    "task-g2-pricing": "pricing gate",
    "task-g2-timer": "timer / debit / hard stop",
    "task-g2-refund": "refund ledger",
    "task-g2-accruals": "accruals / incentives",
    "task-g3-home": "storefront",
    "task-g3-catalog": "expert catalog",
    "task-g3-profile": "expert profile",
    "task-g3-quiz": "quiz / matching / start",
    "task-g3-qa": "end-to-end path proof",
    "task-g3-field-weight": "profile field weight / completeness score",
    "task-g3-rotation": "expert ranking / rotation",

    "task-g4-docs": "terms / documents",
    "task-g4-support-notifications": "support notifications",
    "task-g5-events": "funnel events",
    "task-g5-dashboard": "dashboard",
    "task-g5-kpi": "KPI table",
    "task-g5-marketing-gate": "marketing gate",
    "task-g6-assignment": "assignment queue",
    "task-g6-sla": "SLA / response time",
    "task-g6-quality": "QA / quality control",
    "task-g6-training": "training / playbook",
    "task-g6-team-notifications": "team notifications",
    "task-g6-admin-url": "separate admin URL",
    "task-g6-isolated-admin-access": "isolated admin access / no frontend access"
  };

  function stageClass(stage) {
    if (stage === "accepted_bounded_slice") return "stage-accepted";
    if (stage === "implementation_in_progress") return "stage-packet";
    if (stage === "proof_gap") return "stage-packet";
    if (stage === "packet_ready") return "stage-packet";
    if (stage === "inventoried") return "stage-inventory";
    return "stage-plan";
  }

  function stageLabel(stage) {
    if (stage === "accepted_bounded_slice") return "Срез согласован";
    if (stage === "implementation_in_progress") return "Внедрение начато / proof открыт";
    if (stage === "proof_gap") return "Нужна проверка";
    if (stage === "packet_ready") return "Пакет готов";
    if (stage === "inventoried") return "Оценка собрана";
    return "Только план";
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get("task");
  const task = id ? tasks[id] : null;
  const content = document.getElementById("content");
  const detailLink = document.getElementById("detail-link");

  if (!task) {
    content.innerHTML = '<div class="empty"><b>Задача не найдена.</b><br>Вернитесь к списку и откройте оценку заново.</div>';
    detailLink.href = "index.html";
    return;
  }

  detailLink.href = task.detailHref;
  const scoreVector = siteScoreByTask[id] || [0,0,0,0,0];
  const totalScore = scoreVector.reduce((sum, value) => sum + value, 0);
  const tzReady = tzReadyByTask[id] || 0;

  function renderList(items) {
    return "<ul>" + items.map((item) => "<li>" + item + "</li>").join("") + "</ul>";
  }

  function scoreState(value, max) {
    if (value <= 0) return "нет";
    if (value >= max) return "готово";
    return "частично";
  }

  function renderScoreRows() {
    const details = criterionDetailsByTask[id] || [];
    return siteCriteria.map((criterion, index) => {
      const value = scoreVector[index] || 0;
      const percent = Math.round((value / criterion.max) * 100);
      const detail = details[index] || "Расшифровка для этой задачи еще не собрана.";
      return `
        <details class="criterion-detail">
          <summary>
            <div class="score-row">
              <div>
                <b>${criterion.label}</b>
                <div class="score-state">${scoreState(value, criterion.max)}</div>
              </div>
              <div class="score-points">${value}/${criterion.max}</div>
              <div class="score-line"><div class="score-fill" style="width:${percent}%"></div></div>
            </div>
          </summary>
          <div class="criterion-body"><p>${detail}</p></div>
        </details>`;
    }).join("");
  }

  content.innerHTML = `
    <section class="hero">
      <div class="hero-head">
        <span class="badge ${stageClass(task.stage)}">${stageLabel(task.stage)}</span>
        <span class="badge">${task.goal}</span>
      </div>
      <h2>${task.code} ${task.title}<span class="term-en">${taskTermEn[id] || ""}</span></h2>
      <p>Короткая оценка без шума: что уже реально собрано, что еще обязательно нужно довести и как понять, что задача готова не на словах, а на сайте.</p>
      <div class="meta-grid">
        <div class="meta-box"><span>% сайта</span><b>${totalScore}%</b></div>
        <div class="meta-box"><span>ТЗ</span><b>${tzReady}%</b></div>
        <div class="meta-box"><span>Статус</span><b>${stageLabel(task.stage)}</b></div>
        <div class="meta-box"><span>Полные детали</span><b><a href="${task.detailHref}">Открыть</a></b></div>
      </div>
    </section>

    <details class="disclosure">
      <summary>Из чего собран % сайта</summary>
      <div class="disclosure-body">
        <div class="score-card">
          <h3>Критерии оценки</h3>
          <p>Оценка складывается из 5 критериев по 20 баллов.</p>
          <div class="score-list">${renderScoreRows()}</div>
          <div class="score-note">Шаг оценки: 0 / 5 / 10 / 15 / 20. Итог = сумма критериев.</div>
        </div>
      </div>
    </details>

    <section class="section-grid">
      <article class="card good">
        <h3>Что уже готово</h3>
        <div class="card-body">${renderList(task.ready)}</div>
      </article>
      <article class="card todo">
        <h3>Что нужно добить</h3>
        <div class="card-body">${renderList(task.needed)}</div>
      </article>
      <article class="card accept">
        <h3>Когда считаем готовым</h3>
        <div class="card-body">${renderList(task.accept)}</div>
      </article>
    </section>
  `;
})();
</script>
