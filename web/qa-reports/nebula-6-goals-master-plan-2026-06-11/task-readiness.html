  function readerStatus(task) {
    const factualStage = task.factual && task.factual.stage ? task.factual.stage : stageLabel(task.stage);
    if (/ждём|ожидает|ожидаем/i.test(factualStage)) return "Реализовано локально; ждём выкладку на сервер.";
    if (/Реализовано/.test(factualStage)) return "Функция уже есть; проверяем оставшиеся случаи.";
    if (/Частичная доставка/.test(factualStage)) return "Часть функции уже доставлена; проверяем недостающее.";
    if (/План|Требования|Контракт/.test(factualStage)) return "Пока готовим требования; работу сайта ещё не принимаем.";
    return "Рабочий контур описан; подтверждаем его на текущей версии сайта.";
  }

  function readerSummary(task) {
    const override = readerOverrides[id] || {};
    return override.summary || `${readerStatus(task)} Подробные материалы для исполнителя вынесены ниже.`;
  }

  function readerDecision(task) {
    const override = readerOverrides[id] || {};
    return override.decision || "Оставить задачу в работе до выполнения следующего шага и сохранения подтверждения.";
  }

  function readerReady(task) {
    const override = readerOverrides[id] || {};
    return override.ready || `${readerStatus(task)} Ожидаемый результат описан в карточке; его проверяем на сайте.`;
  }

  function readerNext(task) {
    const override = readerOverrides[id] || {};
    return override.next || "Пройти основной сценарий на текущем сайте, проверить результат и зафиксировать расхождение, если оно есть.";
  }

  function readerDone(task) {
    const override = readerOverrides[id] || {};
    return override.done || "Принимаем после положительного и отрицательного сценария на текущей версии сайта и сохранённого подтверждения.";
  }

  function readerInstruction(task) {
    const override = readerOverrides[id] || {};
    return override.instruction || "1. Открыть текущую сборку.\n2. Выполнить следующий шаг из карточки.\n3. Записать идентификатор, время и результат.\n4. Приложить ссылку на подтверждение.";
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get("task");
  const task = id ? tasks[id] : null;
  const content = document.getElementById("content");
  const detailLink = document.getElementById("detail-link");

  if (!task) {
    content.innerHTML = '<div class="empty"><b>Задача не найдена.</b><br>Вернитесь к списку и откройте оценку заново.</div>';
    detailLink.href = "index.html";
    return;
  }

  detailLink.href = task.detailHref;
  const requirement = currentRequirementStatus(task);

  function renderList(items) {
    return "<ul>" + items.map((item) => "<li>" + item + "</li>").join("") + "</ul>";
  }

  content.innerHTML = `
    <section class="hero">
      <div class="hero-head">
        <span class="badge ${stageClass(task.stage)}">${task.factual ? task.factual.stage : stageLabel(task.stage)}</span>
        <span class="badge">${task.goal}</span>
      </div>
      <h2>${task.code} ${task.title}</h2>
      <p class="plain-note">${readerSummary(task)}</p>
      <div class="decision-banner">
        <span class="decision-kicker">Решение сейчас</span>
        <strong>${readerDecision(task)}</strong>
      </div>
      <div class="meta-grid">
        <div class="meta-box"><span>Состояние продукта</span><b>${readerStatus(task)}</b><small>Подробные материалы для исполнителя вынесены ниже.</small></div>
        <div class="meta-box"><span>Техническое задание</span><b>${requirement.label}</b><small>${requirement.note}</small></div>
        <div class="meta-box"><span>Приёмка</span><b>Открыта</b><small>Закрываем после следующего шага и подтверждения.</small></div>
      </div>
    </section>

    <section class="section-grid">
      <article class="card good">
        <h3>Уже есть</h3>
        <div class="card-body"><p class="plain-note">${readerReady(task)}</p></div>
      </article>
      <article class="card todo">
        <h3>Сделать сейчас</h3>
        <div class="card-body"><p class="plain-note"><b>${readerNext(task)}</b></p></div>
      </article>
      <article class="card accept">
        <h3>Закрываем, когда</h3>
        <div class="card-body"><p class="plain-note">${readerDone(task)}</p></div>
      </article>
    </section>

    <details class="technical-panel">
      <summary>Технические данные и инструкция для исполнителя</summary>
      <div class="technical-body">
        <p class="technical-lead">Этот блок нужен разработчику и проверяющему. Здесь исходные данные, точная техническая формулировка и порядок действий; он не меняет решение руководителя выше.</p>
        <div class="technical-grid">
          <article class="technical-card">
            <h3>Что уже подтверждено</h3>
            ${renderList(task.ready)}
            <p class="technical-label">Внутреннее имя</p>
            <code class="technical-code">${taskTermEn[id] || "не задано"}</code>
          </article>
          <article class="technical-card">
            <h3>Как действовать</h3>
            <p class="plain-note">${readerNext(task)}</p>
            <pre class="result-template">${readerInstruction(task)}</pre>
            <p class="technical-label">Точная запись из реестра</p>
            <code class="technical-code">${task.factual ? task.factual.next : "Следующий шаг ещё не записан."}</code>
          </article>
          <article class="technical-card">
            <h3>Какой результат сохранить</h3>
            ${renderList(task.accept)}
            <p><a href="${implementation.reportHref}">Открыть источники и границы приёмки</a></p>
          </article>
        </div>
      </div>
    </details>
  `;

</script>
