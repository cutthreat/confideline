<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confideline email templates | визуальный просмотр</title>
  <style>
    :root {
      --ink:#172033;
      --muted:#667085;
      --soft:#f5f7fb;
      --line:#d9e0ea;
      --card:#ffffff;
      --brand:#5d3fd3;
      --teal:#168b8b;
      --warn:#a15c00;
      --warn-bg:#fff6e6;
      --ok:#176b48;
      --ok-bg:#eaf7ef;
      --shadow:0 18px 44px rgba(21,32,51,.09);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--ink);
      background:var(--soft);
      line-height:1.5;
    }
    a { color:var(--brand); text-decoration:none; font-weight:700; }
    a:hover { text-decoration:underline; }
    .layout { display:grid; grid-template-columns:320px minmax(0,1fr); min-height:100vh; }
    .sidebar {
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
      padding:24px 18px;
      border-right:1px solid var(--line);
      background:#fff;
    }
    .brand { margin:0 0 6px; color:var(--teal); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    h1 { margin:0; font-size:25px; line-height:1.12; letter-spacing:0; }
    .side-note { margin:12px 0 18px; color:var(--muted); font-size:14px; }
    .search { width:100%; min-height:42px; padding:0 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
    .filters { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 18px; }
    .filter {
      min-height:36px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      color:var(--ink);
      font-weight:700;
      cursor:pointer;
    }
    .filter.active { border-color:var(--brand); background:var(--brand); color:#fff; }
    .summary { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 16px; }
    .summary-item { padding:10px; border:1px solid var(--line); border-radius:8px; background:#fafcff; }
    .summary-item strong { display:block; font-size:20px; line-height:1; }
    .summary-item span { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .nav { display:grid; gap:7px; }
    .nav a {
      display:block;
      padding:9px 10px;
      border:1px solid transparent;
      border-radius:8px;
      color:var(--ink);
      font-size:13px;
      font-weight:700;
      background:#fff;
    }
    .nav a:hover { border-color:var(--line); background:#f8faff; text-decoration:none; }
    .nav small { display:block; margin-top:2px; color:var(--muted); font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .main { padding:30px min(4vw,46px) 60px; }
    .topbar {
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      margin:0 0 18px;
    }
    .topbar p { margin:0; color:var(--muted); }
    .toggle {
      display:flex;
      gap:6px;
      padding:4px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
    }
    .toggle button {
      min-height:34px;
      padding:0 12px;
      border:0;
      border-radius:6px;
      background:transparent;
      color:var(--ink);
      font-weight:800;
      cursor:pointer;
    }
    .toggle button.active { background:var(--ink); color:#fff; }
    .template-card {
      margin:0 0 22px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--card);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .template-head {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:16px;
      padding:20px 22px;
      border-bottom:1px solid var(--line);
    }
    .template-title { margin:0; font-size:22px; line-height:1.2; letter-spacing:0; }
    .subject { margin:8px 0 0; color:var(--muted); font-size:15px; overflow-wrap:anywhere; }
    .badges { display:flex; flex-wrap:wrap; gap:7px; justify-content:flex-end; align-content:flex-start; }
    .badge {
      display:inline-flex;
      align-items:center;
      min-height:26px;
      padding:0 9px;
      border-radius:999px;
      background:#eef3f9;
      color:#344054;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .badge.warn { background:var(--warn-bg); color:var(--warn); }
    .badge.ok { background:var(--ok-bg); color:var(--ok); }
    .meta {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:1px;
      background:var(--line);
      border-bottom:1px solid var(--line);
    }
    .meta div { min-width:0; padding:11px 12px; background:#fbfcff; }
    .meta span { display:block; color:var(--muted); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
    .meta code { display:block; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#263044; font-family:Consolas, Monaco, monospace; font-size:13px; }
    .content { padding:18px 22px 22px; }
    .preview-shell {
      border:1px solid var(--line);
      border-radius:8px;
      background:#eef2f7;
      padding:18px;
      overflow:auto;
    }
    .preview-frame {
      display:block;
      width:100%;
      max-width:680px;
      min-height:420px;
      margin:0 auto;
      border:1px solid #cfd7e3;
      border-radius:8px;
      background:#fff;
    }
    body.mobile-preview .preview-frame { max-width:390px; }
    .details { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:14px; margin-top:14px; }
    .panel { border:1px solid var(--line); border-radius:8px; background:#fbfcff; padding:14px; }
    .panel h3 { margin:0 0 8px; font-size:14px; }
    .vars { display:flex; flex-wrap:wrap; gap:6px; }
    .var { padding:5px 7px; border-radius:6px; background:#eef3f9; color:#344054; font-family:Consolas, Monaco, monospace; font-size:12px; }
    pre {
      max-height:240px;
      overflow:auto;
      margin:0;
      padding:12px;
      border-radius:7px;
      background:#111827;
      color:#e5e7eb;
      font-family:Consolas, Monaco, monospace;
      font-size:12px;
      line-height:1.45;
      white-space:pre-wrap;
    }
    .hidden { display:none !important; }
    .empty { padding:42px; text-align:center; color:var(--muted); }
    @media (max-width:980px) {
      .layout { grid-template-columns:1fr; }
      .sidebar { position:relative; height:auto; border-right:0; border-bottom:1px solid var(--line); }
      .nav { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .meta { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .details { grid-template-columns:1fr; }
    }
    @media (max-width:620px) {
      .main { padding:18px 12px 42px; }
      .template-head { grid-template-columns:1fr; padding:18px; }
      .badges { justify-content:flex-start; }
      .meta { grid-template-columns:1fr; }
      .content { padding:14px; }
      .preview-shell { padding:10px; }
      .nav { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <p class="brand">Confideline / email templates</p>
      <h1>Визуальный просмотр писем</h1>
      <p class="side-note">Все HTML-шаблоны из пакета показаны в сверстанном виде. По умолчанию переменные заменены демо-значениями, чтобы оценить письмо как клиент.</p>
      <input id="search" class="search" type="search" placeholder="Поиск: тема, event, ключ">
      <div class="filters" id="filters">
        <button class="filter active" data-filter="all">Все</button>
        <button class="filter" data-filter="needs">Нужен backend</button>
        <button class="filter" data-filter="service">Сервисные</button>
        <button class="filter" data-filter="behavior">Поведенческие</button>
        <button class="filter" data-filter="marketing">Маркетинг</button>
        <button class="filter" data-filter="settings">User settings</button>
      </div>
      <div class="summary" id="summary"></div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="main">
      <div class="topbar">
        <p><strong id="visible-count">19</strong> шаблонов. Это клиентский просмотр, не доказательство готового backend-trigger.</p>
        <div class="toggle" aria-label="Настройки просмотра">
          <button id="desktopMode" class="active" type="button">Desktop</button>
          <button id="mobileMode" type="button">Mobile</button>
          <button id="demoToggle" class="active" type="button">Демо-данные</button>
        </div>
      </div>
      <div id="cards"></div>
    </main>
  </div>

      advisorProfileUrl: 'https://confideline.com/advisor/demo',
      amount: '49 BYN',
      appealUrl: 'https://confideline.com/support/refund/demo',
      chatClosedAt: '27 мая 2026, 18:40',
      chatStartedAt: '27 мая 2026, 16:15',
      chatUrl: 'https://confideline.com/account/chat/demo',
      confirmUrl: 'https://confideline.com/confirm/demo',
      confirmationExpiresAt: 'через 24 часа',
      contactEmail: 'support@confideline.com',
      currency: 'BYN',
      helpCenterUrl: 'https://confideline.com/help',
      legalMerchantName: 'Confideline',
      loginUrl: 'https://confideline.com/login',
      orderId: 'CL-2048',
      passwordResetUrl: 'https://confideline.com/reset/demo',
      paymentRetryUrl: 'https://confideline.com/payment/retry/demo',
      paymentUrl: 'https://confideline.com/payment/demo',
      privacyUrl: 'https://confideline.com/privacy',
      refundAmount: '49 BYN',
      refundEta: 'до 5 рабочих дней',
      refundPolicyUrl: 'https://confideline.com/refund-policy',
      reviewUrl: 'https://confideline.com/review/demo',
      safetyUrl: 'https://confideline.com/safety',
      sameAdvisorUrl: 'https://confideline.com/advisor/elena',
      securityUrl: 'https://confideline.com/account/security',
      siteName: 'Confideline',
      siteUrl: 'https://confideline.com',
      supportCaseId: '8421',
      supportEmail: 'support@confideline.com',
      supportUrl: 'https://confideline.com/support',
      termsUrl: 'https://confideline.com/terms',
      userName: 'Анна'
    };
    let activeFilter = 'all';
    let demoEnabled = true;

    function decode64(value) {
      const binary = atob(value || '');
      const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
      return new TextDecoder('utf-8').decode(bytes);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function withDemoValues(value) {
      if (!demoEnabled) return value;
      return String(value).replace(/\{\{\s*([a-zA-Z0-9_.-]+)\s*\}\}/g, (match, key) => {
        return Object.prototype.hasOwnProperty.call(demoValues, key) ? demoValues[key] : match;
      });
    }

    function emailDoc(fragment) {
      return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>${fragment}</body></html>`;
    }

    function backendBadge(item) {
      return item.needs_new_backend_event
        ? '<span class="badge warn">нужен backend event</span>'
        : '<span class="badge ok">event есть в dropdown</span>';
    }

    function itemMatches(item, query) {
      const haystack = [item.key, item.subject, item.event_name, item.source_trigger, item.family, item.phase].join(' ').toLowerCase();
      return haystack.includes(query.toLowerCase());
    }

    function itemPassesFilter(item) {
      if (activeFilter === 'needs') return item.needs_new_backend_event;
      if (activeFilter === 'service') return item.type_id === 1;
      if (activeFilter === 'behavior') return item.type_id === 2;
      if (activeFilter === 'marketing') return item.type_id === 3;
      if (activeFilter === 'settings') return item.count_user_settings === 1;
      return true;
    }

    function renderSummary() {
      const total = templates.length;
      const needs = templates.filter(item => item.needs_new_backend_event).length;
      const service = templates.filter(item => item.type_id === 1).length;
      const settings = templates.filter(item => item.count_user_settings === 1).length;
      document.getElementById('summary').innerHTML = [
        ['Всего', total],
        ['Backend', needs],
        ['Сервисные', service],
        ['Settings', settings]
      ].map(([label, value]) => `<div class="summary-item"><strong>${value}</strong><span>${label}</span></div>`).join('');
    }

    function render() {
      const query = document.getElementById('search').value.trim();
      const visible = templates.filter(item => itemPassesFilter(item) && itemMatches(item, query));
      document.getElementById('visible-count').textContent = visible.length;

      document.getElementById('nav').innerHTML = visible.map(item => `
        <a href="#tpl-${item.sort}">
          ${String(item.sort).padStart(2, '0')}. ${escapeHtml(item.key)}
          <small>${escapeHtml(item.subject)}</small>
        </a>
      `).join('');

      const cards = visible.map(item => {
        const html = withDemoValues(decode64(item.html64));
        const txt = withDemoValues(decode64(item.txt64));
        const vars = (item.variables || []).map(variable => `<span class="var">{{${escapeHtml(variable)}}}</span>`).join('');
        return `
          <article class="template-card" id="tpl-${item.sort}">
            <header class="template-head">
              <div>
                <h2 class="template-title">${String(item.sort).padStart(2, '0')}. ${escapeHtml(item.key)}</h2>
                <p class="subject">${escapeHtml(withDemoValues(item.subject))}</p>
              </div>
              <div class="badges">
                <span class="badge">${escapeHtml(typeLabels[item.type_id] || 'Тип ' + item.type_id)}</span>
                ${backendBadge(item)}
                ${item.count_user_settings ? '<span class="badge">user settings</span>' : ''}
              </div>
            </header>
            <section class="meta">
              <div><span>event_name</span><code title="${escapeHtml(item.event_name)}">${escapeHtml(item.event_name)}</code></div>
              <div><span>condition_id</span><code>${escapeHtml(item.condition_id)}</code></div>
              <div><span>delay</span><code>${escapeHtml(item.delay)}</code></div>
              <div><span>source trigger</span><code title="${escapeHtml(item.source_trigger)}">${escapeHtml(item.source_trigger)}</code></div>
            </section>
            <section class="content">
              <div class="preview-shell">
                <iframe class="preview-frame" title="${escapeHtml(item.key)}" loading="lazy" srcdoc="${escapeHtml(emailDoc(html))}"></iframe>
              </div>
              <div class="details">
                <div class="panel">
                  <h3>Переменные</h3>
                  <div class="vars">${vars || '<span class="var">нет</span>'}</div>
                </div>
                <div class="panel">
                  <h3>TXT-версия</h3>
                  <pre>${escapeHtml(txt)}</pre>
                </div>
              </div>
            </section>
          </article>
        `;
      }).join('');

      document.getElementById('cards').innerHTML = cards || '<div class="template-card empty">По текущему фильтру ничего не найдено.</div>';
      resizeFrames();
    }

    function resizeFrames() {
      document.querySelectorAll('.preview-frame').forEach(frame => {
        frame.addEventListener('load', () => {
          try {
            const doc = frame.contentDocument || frame.contentWindow.document;
            const height = Math.max(420, Math.min(1600, doc.documentElement.scrollHeight + 24));
            frame.style.height = `${height}px`;
          } catch (error) {
            frame.style.height = '620px';
          }
        }, { once:true });
      });
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('filters').addEventListener('click', event => {
      const button = event.target.closest('[data-filter]');
      if (!button) return;
      activeFilter = button.dataset.filter;
      document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
      render();
    });
    document.getElementById('desktopMode').addEventListener('click', () => {
      document.body.classList.remove('mobile-preview');
      document.getElementById('desktopMode').classList.add('active');
      document.getElementById('mobileMode').classList.remove('active');
    });
    document.getElementById('mobileMode').addEventListener('click', () => {
      document.body.classList.add('mobile-preview');
      document.getElementById('mobileMode').classList.add('active');
      document.getElementById('desktopMode').classList.remove('active');
    });
    document.getElementById('demoToggle').addEventListener('click', () => {
      demoEnabled = !demoEnabled;
      document.getElementById('demoToggle').classList.toggle('active', demoEnabled);
      render();
    });

    renderSummary();
    render();
  </script>
</body>
</html>
