<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confideline Admin Preview</title>
  <meta http-equiv="refresh" content="0; url=../Chat/admin-chat-preview-local/">
  <style>
    :root {
      --bg: #eef4fb;
      --panel: #ffffff;
      --line: #d8e0ea;
      --text: #203246;
      --muted: #66788a;
      --accent: #2f80ed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #ffffff 0, #f7fbff 35%, var(--bg) 100%);
    }
    .card {
      width: min(680px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 18px 40px rgba(27, 45, 69, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
    }
    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid var(--line);
      color: var(--text);
      background: #fff;
      font-size: 14px;
    }
    .btn-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: #eef3f9;
      color: #38506a;
      font-family: Consolas, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Confideline Admin Preview</h1>
    <p>Эта точка входа создана для GitHub Pages и заменяет локальный адрес вида <code>127.0.0.1:8092/admin</code>.</p>
    <p>Если автоматический переход не сработал, откройте нужную панель вручную.</p>
    <div class="actions">
      <a class="btn btn-primary" href="../Chat/admin-chat-preview-local/">Открыть admin panel</a>
      <a class="btn" href="../Chat/admin-chat-preview-local/chat-translator-preview.html">Открыть чат</a>
      <a class="btn" href="../Chat/admin-chat-preview-local/translator-settings-preview.html">Открыть настройки переводчика</a>
    </div>
  </main>
</body>
</html>
