<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предпросмотр анкеты — Confideline</title>
  <link rel="stylesheet" href="assets/site-preview/source-sans-pro.css">
  <link rel="stylesheet" href="assets/site-preview/app.min.css">
  <link rel="stylesheet" href="assets/content/assets/500c0610/css/font-awesome.min.css">
  <link rel="stylesheet" href="profile-preview.css?v=5">
  <script src="assets/site-preview/jquery.js" defer></script>
  <script src="assets/site-preview/selectize.js" defer></script>
  <script src="profile-fields-data.js?v=2" defer></script>
  <script src="profile-field-options.js" defer></script>
  <script src="profile-preview.js?v=9" defer></script>
</head>
<body class="ltr body-default auto profile-preview-page">
  <header class="preview-toolbar">
    <div class="preview-toolbar-inner">
      <a href="./" id="preview-back" class="preview-back">← К полям профиля</a>
      <strong>Предпросмотр</strong>
      <label>Анкета
        <select id="preview-type">
          <option value="client">Клиент</option>
          <option value="expert">Эксперт</option>
        </select>
      </label>
      <label id="preview-audience-label">Зритель
        <select id="preview-audience">
          <option value="regular">Обычный пользователь</option>
          <option value="premium">Премиум-пользователь</option>
        </select>
      </label>
      <span class="preview-sample">Пример данных</span>
    </div>
    <nav class="preview-views" aria-label="Страница предпросмотра">
      <button type="button" data-view="profile">Анкета</button>
      <button type="button" data-view="form">Редактирование анкеты</button>
      <button type="button" data-view="search">Фильтр «Обзора»</button>
    </nav>
  </header>
  <div class="page">
    <header class="header py-2">
      <div class="container"><div class="d-flex align-items-center">
        <img class="header-brand-img" src="assets/site-preview/logo.png" alt="YouDate">
        <div class="ml-auto preview-account">Справка <span>Пример аккаунта</span></div>
      </div></div>
    </header>
    <nav class="header p-0 preview-site-nav" aria-label="Навигация сайта">
      <div class="container"><span><i class="fa fa-home" aria-hidden="true"></i> Главная</span>
        <span class="active"><i class="fa fa-user-o" aria-hidden="true"></i> Обзор</span>
        <span><i class="fa fa-th-large" aria-hidden="true"></i> Группы</span>
        <span><i class="fa fa-heart-o" aria-hidden="true"></i> Контакты</span>
        <span><i class="fa fa-envelope-o" aria-hidden="true"></i> Сообщения</span>
        <span><i class="fa fa-map-o" aria-hidden="true"></i> Страны</span>
      </div>
    </nav>
    <main class="preview-main container" id="preview-content" aria-live="polite"></main>
  </div>
</body>
</html>
