<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';img-src data:;style-src 'unsafe-inline';base-uri 'none';form-action 'none'"><title>Поддержка клиента — сравнения</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#24384b;font:15px/1.55 Arial,sans-serif}main{max-width:1440px;margin:auto;padding:28px}h1{font-size:30px;line-height:1.2}h2{font-size:22px;margin-top:32px}h3{font-size:18px}a{color:#185c8d;overflow-wrap:anywhere}section,details,figure{background:white;padding:20px;border:1px solid #dce3e9;margin:14px 0;border-radius:8px}summary{font-weight:bold;cursor:pointer}.notice{background:#fff3d7;border-left:5px solid #a66d0c;padding:16px}.counts{display:flex;flex-wrap:wrap;gap:10px}.counts span{background:#fff;border:1px solid #d5dfe7;border-radius:6px;padding:10px 16px}.scroll{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border-bottom:1px solid #dce3e9;vertical-align:top;text-align:left;min-width:110px}th{background:#284b63;color:white}td{white-space:pre-wrap;overflow-wrap:anywhere}.FAIL{background:#ffeded}.RETEST,.NOT_RUN{background:#fff8e9}.N_A{background:#edf0f3}.muted{color:#5b6e7e}img{display:block;max-width:100%;height:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.proof{position:relative}.proof svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}figcaption{margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f7;padding:12px}code{overflow-wrap:anywhere}dt{font-weight:bold}dd{margin:0 0 10px}nav{display:flex;gap:16px;flex-wrap:wrap}@media(max-width:700px){main{padding:14px}h1{font-size:25px}.pair{grid-template-columns:1fr}section,details,figure{padding:14px}}@media print{details{break-inside:avoid}.scroll{overflow:visible}main{max-width:none;padding:0}}</style><main><h1>Сравнения до / после</h1><p>В этом проходе новые пары не заявлены. Прежние оригиналы сохранены отдельно; см. history-index.json. Для честной пары нужны одинаковые состояние, роль, viewport/масштаб и подписанные версии; новый снимок не подменяется старым.</p><a href="../report.html">К отчёту</a></main></html>
