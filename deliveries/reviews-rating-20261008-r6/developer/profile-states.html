<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Анкета: состояния отзывов</title>
<style>*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:#fff;color:#303843;font:14px/1.5 Arial,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px;margin:18px 0 8px}p{margin:8px 0 20px;color:#526879}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#165a9c}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border-bottom:1px solid #e4e9ef;padding:11px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#fbfcfd}th:first-child{width:115px}th:nth-child(2){width:230px}th:nth-child(3){width:180px}th:last-child{width:100px}td:last-child{white-space:nowrap}td a+a{margin-left:14px}@media(max-width:650px){main{padding:16px}h1{font-size:22px}thead{display:none}tr{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:10px 0;border-bottom:1px solid #e4e9ef}td{border:0;padding:4px 0}td:first-child{grid-column:1/-1;color:#526879;font-size:12px}td:nth-child(2){font-weight:600}td:nth-child(3){grid-column:1/-1;grid-row:3}td:nth-child(4){grid-column:1/-1;grid-row:4}td:last-child{grid-column:2;grid-row:2;padding-left:12px}}</style></head>
<body><main><nav><a href="index.html">Макеты</a><a href="SPEC.html#frontend-states">ТЗ: фронт</a><a href="profile.html#reviews">Общее демосостояние</a></nav><h1>Анкета: состояния отзывов</h1><p>Каждый вариант открывается отдельно с фиксированными синтетическими данными. Действия внутри варианта работают, но не меняют другие примеры. RU и EN используют один расчёт.</p><table><thead><tr><th>Группа</th><th>Состояние</th><th>Действие</th><th>Ожидаемый результат</th><th>Макет</th></tr></thead><tbody id="case-rows"></tbody></table></main>
<script src="reviews-profile-states.js"></script><script>
'use strict';
document.getElementById('case-rows').innerHTML=ReviewProfileStates.cases.map(c=>'<tr><td>'+c.group+'</td><td>'+c.name+'</td><td>'+c.action+'</td><td>'+c.expected+'</td><td><a href="profile.html?case='+c.id+'&amp;lang=ru#reviews">RU</a><a href="profile.html?case='+c.id+'&amp;lang=en#reviews">EN</a></td></tr>').join('');
</script></body></html>
