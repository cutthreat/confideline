<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; object-src 'none'"><title>Написать отзыв</title>
<link rel="stylesheet" href="reviews-site-assets/vendor/css/bootstrap.css"><link rel="stylesheet" href="reviews-site-assets/vendor/css/font-awesome.min.css"><link rel="stylesheet" href="reviews-site-assets/vendor/css/admin.min.css"><link rel="stylesheet" href="reviews-site-assets/admin-custom.css"><link rel="stylesheet" href="reviews-admin-panel.css"></head>
<body class="skin-youdate fixed sidebar-mini" data-page="create"><div class="wrapper"><header class="main-header"></header><aside class="main-sidebar" id="admin-sidebar" aria-label="Administration"></aside><button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close Menu" hidden></button><div class="content-wrapper"><section class="content-header"><h1 data-i18n="write">Написать отзыв</h1><ol class="breadcrumb"><li>Administration</li><li class="active" data-i18n="create">Новый отзыв</li></ol></section><main class="content">
<div id="create-forbidden" class="alert alert-danger" role="alert" hidden><i class="fa fa-lock" aria-hidden="true"></i> <strong data-i18n="forbidden">Доступ запрещён</strong></div>
<section class="box no-border review-create-surface" id="create-surface" hidden><header class="box-header with-border"><h2 class="box-title" data-i18n="create">Новый отзыв</h2></header>
<form id="create-form" novalidate><div class="box-body"><div class="form-group"><label for="review-author" data-i18n="author">Профиль клиента</label><select class="form-control" id="review-author" required><option value="" data-i18n="selectAuthor">Выберите профиль</option><option value="USR-301">Ирина · USR-301</option><option value="USR-302">Александр · USR-302</option><option value="USR-303">Анна · USR-303</option></select></div><div class="form-group"><label for="create-expert" data-i18n="expert">Эксперт</label><select class="form-control" id="create-expert"><option value="EX-101">Marcus Antoniu · EX-101</option><option value="EX-102">Elena Petrova · EX-102</option></select></div><fieldset class="review-admin-star-picker"><legend data-i18n="stars">Оценка</legend><div class="review-admin-star-options">
<label><input type="radio" name="admin-stars" value="1" aria-label="1"><span><i class="fa fa-star" aria-hidden="true"></i> 1</span></label><label><input type="radio" name="admin-stars" value="2" aria-label="2"><span><i class="fa fa-star" aria-hidden="true"></i> 2</span></label><label><input type="radio" name="admin-stars" value="3" aria-label="3"><span><i class="fa fa-star" aria-hidden="true"></i> 3</span></label><label><input type="radio" name="admin-stars" value="4" aria-label="4"><span><i class="fa fa-star" aria-hidden="true"></i> 4</span></label><label><input type="radio" name="admin-stars" value="5" aria-label="5"><span><i class="fa fa-star" aria-hidden="true"></i> 5</span></label></div></fieldset>
<div class="form-group"><label for="admin-review-text" data-i18n="text">Текст отзыва (необязательно)</label><textarea class="form-control" id="admin-review-text" rows="4" maxlength="1000"></textarea><small id="create-text-count">0 / 1000</small></div><div class="checkbox"><label><input type="checkbox" id="admin-review-anonymous"><span data-i18n="anonymous">Анонимно</span></label></div><div class="form-group"><label for="create-reason" data-i18n="createReason">Основание добавления</label><textarea class="form-control" id="create-reason" rows="2" maxlength="500" required></textarea></div><p class="text-danger" id="create-error" role="alert" hidden></p></div><footer class="box-footer review-create-footer"><a class="btn btn-default" id="create-cancel"><i class="fa fa-times" aria-hidden="true"></i> <span data-i18n="cancel">Отмена</span></a><button class="btn btn-primary" type="submit" id="create-submit"><i class="fa fa-check" aria-hidden="true"></i> <span id="create-submit-label" data-i18n="submit">Отправить на проверку</span></button></footer></form></section>
<section class="box box-solid review-create-surface" id="create-success" hidden><div class="box-body"><p class="text-success" role="status" id="create-result"></p><a class="btn btn-default" id="create-queue"><i class="fa fa-list" aria-hidden="true"></i> <span data-i18n="queue">К очереди отзывов</span></a> <button class="btn btn-primary" id="create-again" type="button"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> <span data-i18n="again">Написать ещё</span></button></div></section>
</main></div><footer class="main-footer">Powered by <strong>YouDate</strong></footer></div>
<script src="reviews-rating-model.js"></script><script src="reviews-admin-workflow.js"></script><script src="reviews-admin-shell.js"></script><script src="reviews-create-review.js"></script></body></html>
