<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; object-src 'none'"><title>Настройки отзывов</title>
<link rel="stylesheet" href="reviews-site-assets/vendor/css/bootstrap.css"><link rel="stylesheet" href="reviews-site-assets/vendor/css/font-awesome.min.css"><link rel="stylesheet" href="reviews-site-assets/vendor/css/admin.min.css"><link rel="stylesheet" href="reviews-site-assets/admin-custom.css"><link rel="stylesheet" href="reviews-admin-panel.css"></head>
<body class="skin-youdate fixed sidebar-mini" data-page="settings"><div class="wrapper"><header class="main-header"></header><aside class="main-sidebar" id="admin-sidebar" aria-label="Administration"></aside><button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close Menu" hidden></button><div class="content-wrapper"><section class="content-header"><h1 data-i18n="reviewSettings">Настройки отзывов</h1><ol class="breadcrumb"><li>Administration</li><li class="active" data-i18n="reviewSettings">Настройки отзывов</li></ol></section><main class="content">
<div id="settings-forbidden" class="alert alert-danger" role="alert" hidden><i class="fa fa-lock" aria-hidden="true"></i> <strong data-i18n="forbidden">Доступ запрещён</strong></div><div id="settings-surface" hidden>
<section class="box box-solid review-create-surface" id="publication-settings"><header class="box-header with-border"><h2 class="box-title" data-i18n="settings">Настройки публикации</h2></header><form id="settings-form" novalidate><div class="box-body"><div class="checkbox"><label><input type="checkbox" id="moderation-required"><span data-i18n="requireModeration">Модерация новых отзывов и оценок</span></label> <span class="label label-default" id="moderation-state"></span></div><div class="form-group"><label for="settings-reason" data-i18n="ratingReason">Причина изменения</label><textarea class="form-control" id="settings-reason" maxlength="500" rows="2" required></textarea></div><p class="text-danger" id="settings-error" role="alert" hidden></p></div><footer class="box-footer"><button class="btn btn-primary" type="submit"><i class="fa fa-save" aria-hidden="true"></i> <span data-i18n="save">Сохранить</span></button></footer></form></section>
<section class="box box-solid review-create-surface"><header class="box-header with-border"><h2 class="box-title" data-i18n="ratingTitle">Рейтинг эксперта</h2></header><form id="rating-form" novalidate><div class="box-body"><div class="form-group"><label for="settings-expert" data-i18n="expert">Эксперт</label><select class="form-control" id="settings-expert"><option value="EX-101">Marcus Antoniu · EX-101</option><option value="EX-102">Elena Petrova · EX-102</option></select></div><div class="review-rating-values" id="settings-summary" role="status"></div><fieldset class="review-mode-picker"><legend data-i18n="ratingSource">Источник рейтинга</legend><label><input type="radio" name="rating-mode" value="auto" checked> <span data-i18n="autoSource">По опубликованным оценкам</span></label><label><input type="radio" name="rating-mode" value="manual"> <span data-i18n="manualSource">Задать вручную</span></label></fieldset><div class="review-rating-fields" id="manual-rating-fields" hidden><div class="form-group"><label for="manual-rating" data-i18n="manualRating">Рейтинг</label><input class="form-control" id="manual-rating" inputmode="decimal" maxlength="3" placeholder="1.0–5.0"></div><div class="form-group"><label for="manual-votes" data-i18n="manualVotes">Количество голосов</label><input class="form-control" id="manual-votes" inputmode="numeric" maxlength="16" placeholder="0"></div></div><div class="form-group"><label for="rating-reason" data-i18n="ratingReason">Причина изменения</label><textarea class="form-control" id="rating-reason" rows="2" maxlength="500" required></textarea></div><p class="text-danger" id="rating-error" role="alert" hidden></p></div><footer class="box-footer"><button class="btn btn-primary" type="submit"><i class="fa fa-save" aria-hidden="true"></i> <span data-i18n="save">Сохранить</span></button></footer></form></section>
</div></main></div><footer class="main-footer">Powered by <strong>YouDate</strong></footer></div><div class="review-admin-feedback" id="admin-feedback" role="status" hidden></div>
<script src="reviews-rating-model.js"></script><script src="reviews-admin-workflow.js"></script><script src="reviews-admin-shell.js"></script><script src="reviews-settings.js"></script></body></html>
