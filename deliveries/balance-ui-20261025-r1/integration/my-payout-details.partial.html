<!-- Reference markup only. Bind current Yii models, routes, validation and CSRF; no wrapper/chrome or fixture values. -->
<section class="cl-my-payouts" data-preview-only="true" id="cl-finance-my-payout-details">
<header class="cl-payout-heading content-header"><h1>Мои реквизиты для выплат</h1><nav aria-label="Раздел выплат"><a class="btn btn-default" href="/ru/admin/my-payout/index"><i aria-hidden="true" class="fa fa-angle-left"></i> Мои выплаты</a></nav></header>
<section class="content">
<form action="{{ current_Yii_form_action }}" class="cl-panel cl-details-form" id="payout-details-form" method="post">{{ Yii_CSRF_input }}<div class="cl-panel-heading"><div><h2>Получатель</h2><p class="cl-muted">Укажите данные получателя и реквизиты для доступных способов выплаты.</p></div></div><div class="cl-form-body"><div class="cl-recipient-grid"><label for="payout-country">Страна<select class="form-control" id="payout-country" name="PayoutDetailsForm[countryCode]" required="">{{ options_from_current_model }}</select></label><label for="payout-name">Имя и фамилия<input autocomplete="off" class="form-control" id="payout-name" name="PayoutDetailsForm[nameAndFamily]" required="" value="{{ form.nameAndFamily }}"/></label></div><div class="cl-provider-grid"><fieldset class="cl-provider"><legend>Capitalist</legend><label class="cl-checkbox"><input name="PayoutDetailsForm[walletCapitalistIsActive]" type="checkbox"/> Использовать Capitalist для выплат</label><label for="wallet-Capitalist">Кошелёк Capitalist</label><input autocomplete="off" class="form-control" id="wallet-Capitalist" name="PayoutDetailsForm[walletCapitalistNumber]" type="text" value="{{ form.walletCapitalistNumber }}"/></fieldset><fieldset class="cl-provider"><legend>PaySera</legend><label class="cl-checkbox"><input name="PayoutDetailsForm[walletPaySeraIsActive]" type="checkbox"/> Использовать PaySera для выплат</label><label for="wallet-PaySera">Кошелёк PaySera</label><input autocomplete="off" class="form-control" id="wallet-PaySera" name="PayoutDetailsForm[walletPaySeraNumber]" type="text" value="{{ form.walletPaySeraNumber }}"/></fieldset><fieldset class="cl-provider"><legend>AdvCash</legend><label class="cl-checkbox"><input name="PayoutDetailsForm[walletAdvCashIsActive]" type="checkbox"/> Использовать AdvCash для выплат</label><label for="wallet-AdvCash">Кошелёк AdvCash</label><input autocomplete="off" class="form-control" id="wallet-AdvCash" name="PayoutDetailsForm[walletAdvCashNumber]" type="text" value="{{ form.walletAdvCashNumber }}"/></fieldset></div><p class="cl-message" hidden="" id="details-feedback" role="status"></p></div><div class="cl-panel-footer"><button class="btn btn-primary" type="submit">Сохранить платёжные реквизиты</button><a class="btn btn-default" href="/ru/admin/my-payout/index">К выплатам</a></div></form></section></section>
