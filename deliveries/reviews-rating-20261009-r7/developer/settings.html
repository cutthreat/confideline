<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; object-src 'none'"><title>Настройки отзывов</title>
<link rel="stylesheet" href="reviews-site-assets/vendor/css/bootstrap.css"><link rel="stylesheet" href="reviews-site-assets/vendor/css/font-awesome.min.css"><link rel="stylesheet" href="reviews-site-assets/vendor/css/admin.min.css"><link rel="stylesheet" href="reviews-site-assets/admin-custom.css"><link rel="stylesheet" href="reviews-admin-panel.css"></head>
<body class="skin-youdate fixed sidebar-mini" data-page="settings"><div class="wrapper"><header class="main-header"></header><aside class="main-sidebar" id="admin-sidebar" aria-label="Administration"></aside><button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close Menu" hidden></button><div class="content-wrapper"><section class="content-header"><h1 data-i18n="reviewSettings">Настройки отзывов</h1><ol class="breadcrumb"><li>Administration</li><li class="active" data-i18n="reviewSettings">Настройки отзывов</li></ol></section><main class="content">
<div id="settings-forbidden" class="alert alert-danger" role="alert" hidden><i class="fa fa-lock" aria-hidden="true"></i> <strong data-i18n="forbidden">Доступ запрещён</strong></div><div id="settings-surface" hidden>
<section class="box box-solid review-create-surface" id="publication-settings">
<form id="settings-form" novalidate><div class="box-body review-settings-body">
<fieldset class="review-policy-group"><legend data-i18n="siteDisplay">Отображение на сайте</legend>
<div class="checkbox review-policy-master"><label><input type="checkbox" id="reviews-enabled"><span data-i18n="showReviews">Показывать отзывы на сайте</span></label></div>
<div class="checkbox"><label><input type="checkbox" id="rating-visible"><span data-i18n="showRating">Показывать рейтинг и число голосов</span></label></div>
<div class="checkbox"><label><input type="checkbox" id="text-reviews-visible"><span data-i18n="showTexts">Показывать тексты отзывов</span></label></div>
</fieldset>
<fieldset class="review-policy-group"><legend data-i18n="intakePublication">Приём и публикация</legend>
<div class="checkbox"><label><input type="checkbox" id="client-submission-enabled"><span data-i18n="acceptClientReviews">Принимать новые отзывы клиентов</span></label></div>
<div class="checkbox"><label><input type="checkbox" id="moderation-required"><span data-i18n="requireModeration">Модерация новых отзывов и оценок</span></label> <span class="label label-default" id="moderation-state"></span></div>
</fieldset>
<fieldset class="review-policy-group"><legend data-i18n="reviewForm">Форма отзыва</legend>
<div class="checkbox"><label><input type="checkbox" id="anonymous-allowed"><span data-i18n="allowAnonymous">Разрешить анонимные отзывы</span></label></div>
<div class="checkbox"><label><input type="checkbox" id="rating-only-allowed"><span data-i18n="allowRatingOnly">Разрешить оценку без комментария</span></label></div>
<div class="form-group review-text-limit"><label for="max-text-length" data-i18n="maxTextLength">Максимум символов в отзыве</label><input class="form-control" type="number" id="max-text-length" min="1" max="5000" step="1" required></div>
</fieldset>
<div class="form-group"><label for="settings-reason" data-i18n="ratingReason">Причина изменения</label><input class="form-control" id="settings-reason" maxlength="500" required></div>
<p class="text-danger" id="settings-error" role="alert" hidden></p>
<p class="text-warning" id="settings-stale" role="status" data-i18n="settingsConflict" hidden>Настройки изменены в другой вкладке. Загрузите актуальные значения.</p>
</div><footer class="box-footer review-settings-footer"><button class="btn btn-primary" id="settings-save" type="submit"><i class="fa fa-save" aria-hidden="true"></i> <span data-i18n="save">Сохранить</span></button><button class="btn btn-default" id="settings-reload" type="button"><i class="fa fa-undo" aria-hidden="true"></i></button><span class="text-muted" id="settings-dirty" data-i18n="unsavedChanges" hidden>Есть несохранённые изменения</span></footer></form>
</section>
</div></main></div><footer class="main-footer">Powered by <strong>YouDate</strong></footer></div><div class="review-admin-feedback" id="admin-feedback" role="status" hidden></div>
<script src="reviews-rating-model.js"></script><script src="reviews-admin-workflow.js"></script><script src="reviews-admin-shell.js"></script><script src="reviews-settings.js"></script></body></html>
