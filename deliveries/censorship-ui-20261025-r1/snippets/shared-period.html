<!-- Adapt names to the existing view; keep current assets and filter controller. -->
<div class="finance-date-filter" data-finance-date-mode="range">
 <input type="text" id="contact-period" class="form-control" readonly autocomplete="off" data-finance-date-input aria-label="Период" placeholder="Период">
 <button type="button" class="finance-date-open" data-finance-date-open aria-controls="contact-period" aria-label="Выбрать дату"><i class="fa fa-calendar" aria-hidden="true"></i></button>
 <button type="button" class="finance-date-clear" data-finance-date-clear aria-controls="contact-period" aria-label="Очистить фильтр даты" hidden>×</button>
</div>
<input type="hidden" name="date_from" form="contactFilterForm">
<input type="hidden" name="date_to" form="contactFilterForm">
